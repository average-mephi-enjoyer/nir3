[project]
name = "prot-2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "spacy>=3.8.16",
    "tqdm>=4.70.1",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["archive", "output", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
